name: Continuation bootstrap
on:
  push:
    branches: [feat/ai-leads-workspace-continue]
    paths: [.github/workflows/continuation-bootstrap.yml]
permissions:
  contents: read
jobs:
  native-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENABLE_OUTBOUND: 'false'
      OPENAI_API_KEY: ''
      TWILIO_AUTH_TOKEN: ''
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify native source integrity
        run: |
          mkdir -p continuation-inputs
          python recovery/ai-leads-workspace-v2/verify_github_checkpoint.py | tee continuation-inputs/checkpoint.json
          git archive HEAD > continuation-inputs/native-source.tar
      - name: Fresh baseline protections
        run: |
          set -o pipefail
          python -m pip install -r requirements-dev.txt
          python -m pip install fastapi==0.136.3 starlette==1.3.1 pytest==9.0.3 langgraph==1.2.11 langgraph-checkpoint-sqlite==3.1.1 ruff==0.16.8
          python -m pytest tests -q | tee continuation-inputs/baseline.txt
      - name: Prepare isolated local test dependencies
        run: |
          mkdir -p continuation-inputs/wheels /tmp/relay-frontend
          python -m pip freeze > continuation-inputs/python-resolved.txt
          python -m pip download -r continuation-inputs/python-resolved.txt -d continuation-inputs/wheels
          cp recovery/ai-leads-workspace-v2/recovered-dependency-manifests/package*.json /tmp/relay-frontend/
          cd /tmp/relay-frontend
          npm ci
          tar -czf "$GITHUB_WORKSPACE/continuation-inputs/frontend-toolchain.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuation-native-${{ github.sha }}
          path: continuation-inputs/
          retention-days: 7
