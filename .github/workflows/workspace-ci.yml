name: Leads workspace verification
on:
  push:
    branches: [feat/ai-leads-workspace]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENABLE_OUTBOUND: 'false'
      OPENAI_API_KEY: ''
      TWILIO_AUTH_TOKEN: ''
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing protections with patched dependencies
        run: |
          set -o pipefail
          python -m pip install -r requirements-dev.txt
          python -m pip install fastapi==0.136.3 starlette==1.3.1 pytest==9.0.3 langgraph==1.2.11 langgraph-checkpoint-sqlite==3.1.1 ruff==0.16.8 pip-audit
          python -m pytest -q | tee baseline-test-results.txt
      - name: Package verified dependencies
        run: |
          mkdir -p verification-inputs/wheels verification-inputs/frontend
          python -m pip download fastapi==0.136.3 starlette==1.3.1 pytest==9.0.3 langgraph==1.2.11 langgraph-checkpoint-sqlite==3.1.1 ruff==0.16.8 -d verification-inputs/wheels
          python -m pip freeze > verification-inputs/python-resolved.txt
          python -m pip_audit --format=json --output=verification-inputs/python-audit.json
          cd verification-inputs/frontend
          npm init -y
          npm pkg set 'overrides.esbuild=0.28.1'
          npm install --save-exact react@19.2.3 react-dom@19.2.3 @json-render/core@0.20.0 @json-render/react@0.20.0 react-grid-layout@2.2.4 zod@4.3.6
          npm install --save-dev --save-exact typescript@5.9.3 vite@7.3.6 @types/react@19.2.14 @types/react-dom@19.2.3 @types/node@22.16.0 eslint@9.39.2 typescript-eslint@8.55.0 @eslint/js@9.39.2 globals@17.3.0 @playwright/test@1.62.0
          npm ls --all --json > dependency-tree.json
          npm audit --json > audit.json
          tar -czf ../frontend-toolchain.tar.gz .
          cd ../..
          rm -rf verification-inputs/frontend
          cp baseline-test-results.txt verification-inputs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-final-dependencies
          path: verification-inputs/
          retention-days: 3
