name: Leads workspace verification
on:
  push:
    branches: [feat/ai-leads-workspace, feat/ai-leads-workspace-continue]
    paths: ['app/**', 'frontend/**', 'tests/**', 'scripts/**', 'requirements*.txt', 'web/workspace/**', '.github/workflows/workspace-ci.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENABLE_OUTBOUND: 'false'
      OPENAI_API_KEY: ''
      WORKSPACE_API_KEY: ''
      TWILIO_AUTH_TOKEN: ''
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the committed dependency resolution
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
      - name: Verify native source and rendered desktop/mobile application
        run: python scripts/verify_workspace.py --output /tmp/workspace-verification
      - name: Confirm checked-in assets match source and recovery is unchanged
        run: |
          git diff --exit-code -- web/workspace recovery/ai-leads-workspace-v2
          test -z "$(git ls-files --others --exclude-standard web/workspace)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-workspace-verification
          path: |
            /tmp/workspace-verification/
            frontend/test-results/
          retention-days: 14
