name: Publish tested workspace implementation
on:
  push:
    branches: [feat/ai-leads-workspace-continue]
    paths: ['.github/workflows/workspace-final-publication.yml']
permissions:
  contents: write
jobs:
  publish-and-verify:
    if: github.ref == 'refs/heads/feat/ai-leads-workspace-continue'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENABLE_OUTBOUND: 'false'
      OPENAI_API_KEY: ''
      WORKSPACE_API_KEY: ''
      TWILIO_AUTH_TOKEN: ''
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-leads-workspace-continue
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and apply only these reviewed incremental source changes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess
          expected = {
            '06a-native.patch': '100209c9bb47de9396c044c2667a6ede8fc0d28ac809edc87a9599c35017ea1c',
            '06b-native.patch': '3db59c08c833f3fa774f0f97eff502f8698106011a09a6c37caca1a336965176',
            '06c-native.patch': 'ddad62f502af1304d4fe500c89454aa65ba550caf8464774742a96fe4bc10a45',
            '07a-docs.patch': '143f760562ad2cc7b15eed704119cb97262ab270d99b69985cbe7d1c25db9502',
            '07b-docs.patch': 'e71a05febf1dff5e8f7be68bfe3fc9d6cb9e08d3569d25196517c497ea2b0057',
            '07c-docs.patch': 'aaca22c532749b6e2da116d6e8890c9462f33b738af1fc95732fd3ff14e08e19',
          }
          # Correct one identified text-transfer typo before verifying the exact
          # locally tested patch bytes. No malformed native source was published.
          p = Path('continuation/06b-native.patch')
          text = p.read_text()
          bad = "+  await page.getByRole('button', { name: 'Apply updates', exact: true })).click();"
          good = "+  await page.getByRole('button', { name: 'Apply updates', exact: true }).click();"
          if bad in text:
              assert text.count(bad) == 1
              p.write_text(text.replace(bad, good))
          def blob(path):
              return subprocess.check_output(['git','hash-object',str(path)],text=True).strip()
          for name, digest in expected.items():
              path = Path('continuation') / name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, ('patch transfer mismatch', name)
              entries = []
              for section in path.read_text().split('diff --git ')[1:]:
                  first = section.splitlines()[0]
                  oldpath, newpath = first.split(' ')
                  assert oldpath[2:] == newpath[2:]
                  native = newpath[2:]
                  assert not native.startswith(('recovery/', '.data/', '../')) and native != '.env'
                  before, after = re.search(r'^index ([0-9a-f]{40})\.\.([0-9a-f]{40})',section,re.M).groups()
                  if before == '0'*40:
                      assert not Path(native).exists(), native
                  else:
                      assert blob(native) == before, ('newer native work', native)
                  entries.append((native,after))
              subprocess.run(['git','apply','--check','--index','--unidiff-zero',str(path)],check=True)
              subprocess.run(['git','apply','--index','--unidiff-zero',str(path)],check=True)
              for native,after in entries:
                  assert blob(native) == after, ('result mismatch',native)
          subprocess.run(['git','diff','--exit-code','HEAD','--','recovery/ai-leads-workspace-v2'],check=True)
          PY
      - name: Install pinned dependencies and retain exact license notices
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pip check
          npm ci --prefix frontend
          python - <<'PY'
          from pathlib import Path
          from importlib.metadata import distribution
          import subprocess, shutil
          out = Path('docs/licenses'); out.mkdir(exist_ok=True)
          expected = {
            '@json-render/core': '8226d363f88a734e52cc79ead7a5588cc55e76f7',
            '@json-render/react': '8226d363f88a734e52cc79ead7a5588cc55e76f7',
            'react': 'b93be90515ccd0b9daedaa589e42bf5929693f1f',
            'react-dom': 'b93be90515ccd0b9daedaa589e42bf5929693f1f',
            'react-grid-layout': 'e52ca6e6060da10ae86a5c9346b3270314557977',
            'react-draggable': '8b1d6c985665e96062896aefcd7eb79f5cc9f262',
            'react-resizable': '038ea5c1a8e25115abfe8cc1cc0aa1d859210d8e',
            'zod': 'c06579627b432d09779094cd0166b7f37fe51db8',
          }
          for name,want in expected.items():
              source = Path('frontend/node_modules') / name / 'LICENSE'
              assert subprocess.check_output(['git','hash-object',str(source)],text=True).strip() == want
              shutil.copyfile(source,out/(name.replace('@','').replace('/','-')+'-LICENSE.txt'))
          for name in ['langgraph','langgraph_checkpoint','langgraph_checkpoint_sqlite']:
              dist = distribution(name)
              source = next(dist.locate_file(f) for f in dist.files if str(f).endswith('.dist-info/licenses/LICENSE'))
              assert subprocess.check_output(['git','hash-object',str(source)],text=True).strip() == 'fc0602feecdd6748623c852ab534e1ca612673c7'
              shutil.copyfile(source,out/(name+'-LICENSE.txt'))
          PY
          npm run typecheck --prefix frontend
          npm run lint --prefix frontend
          npm run test:unit --prefix frontend
          npm run build --prefix frontend
      - name: Publish useful native milestone before full browser run
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = '''

          ## Final implementation milestone — 2026-09-18

          Continued from newer native head 152dcbcd41f307e53710893ae5f3c30af3648ee6,
          preserving main and the original recovery. Completed the shared manual/AI
          acceptance flow rather than stopping at the original three failed lookups.

          Added actual model-planned geometry fixtures; keyboard/pointer collision
          handling with protected pins; correct initial mobile breakpoint; complete
          small-screen navigation and tab locking; board-only pagination; history,
          column controls, proposals/locks, read/model failure recovery and stale-edit
          acceptance coverage. Worker resume now rejects changed model/prompt/schema
          provenance, and extraction-cache keys include source-chunk content.
          Documentation covers setup, actual library/license integration, evidence,
          retention limits, configuration and every original requirement category.
          Native CI uses the real lockfile/build/fixtures, not restoration scripts.

          Local verification of these exact source blobs: integrity passed; backend
          169 passed, one upstream AnyIO deprecation warning (15.83s); typecheck,
          lint, production build passed; geometry unit tests 8 passed; desktop/mobile
          Chromium 20 passed (3.5m), zero retries/skips. Command:
          `python scripts/verify_workspace.py --output /mnt/data/relay-final-verification`.
          The local environment used Python 3.13.5, Node 22, the pinned dependencies,
          RELAY_TEST_PYTHON pointing to its isolated venv and PLAYWRIGHT_BROWSERS_PATH
          pointing to its installed Chromium. Build ran before browsers.

          Exploratory expanded tests exposed two genuine failures: pointer resize
          left overlapping panels and keyboard mobile edits selected lg instead of
          initial sm. Both were repaired, then the full suite rerun without skips or
          relaxed layout validation. GitHub publication checks full patch hashes,
          parent/result blobs and unchanged recovery. One detected patch-transfer
          punctuation typo was corrected before those checks; no malformed native
          source was published. New one-time publication inputs are removed after
          applying; older recovery scripts are not executed.

          Fresh clean-checkout results and screenshots will be recorded separately
          below and under verification/acceptance-2026-09-18. No live model/provider,
          real lead contact, recording change, public deployment, main change, merge
          or force push. Remaining verification boundaries: live reasoning quality,
          real voice/PSTN, physical mobile/Safari/Firefox, load/security/compliance
          certification, retention operations and multi-process use. These are not
          claimed verified. Final delivery includes an unmerged pull request.
          '''
          import textwrap
          with Path('CONTINUATION.md').open('a') as f: f.write(textwrap.dedent(text))
          PY
          git rm -f continuation/06a-native.patch continuation/06b-native.patch continuation/06c-native.patch continuation/07a-docs.patch continuation/07b-docs.patch continuation/07c-docs.patch .github/workflows/workspace-final-publication.yml
          git add docs/licenses web/workspace CONTINUATION.md
          git diff --exit-code HEAD -- recovery/ai-leads-workspace-v2
          git config user.name 'Relay workspace implementation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(workspace): finish shared AI/manual acceptance, mobile controls, restart safety and documentation'
          git push origin HEAD:refs/heads/feat/ai-leads-workspace-continue
      - name: Fresh complete native verification
        run: |
          set -euo pipefail
          cd frontend
          npx playwright install --with-deps chromium
          cd ..
          python scripts/verify_workspace.py --output /tmp/workspace-final-verification
          git diff --exit-code -- web/workspace recovery/ai-leads-workspace-v2
          test -z "$(git ls-files --others --exclude-standard web/workspace)"
      - name: Preserve actual results and fictional screenshots
        if: always()
        run: |
          set -euo pipefail
          test -f /tmp/workspace-final-verification/RESULTS.json || exit 0
          python - <<'PY'
          from pathlib import Path
          import json, shutil, os
          source = Path('/tmp/workspace-final-verification')
          report = json.loads((source/'RESULTS.json').read_text())
          destination = Path('verification/acceptance-2026-09-18')
          destination.mkdir(parents=True,exist_ok=True)
          for file in source.iterdir():
              if file.suffix in ('.txt','.json'): shutil.copyfile(file,destination/file.name)
          shots = destination/'screenshots'; shots.mkdir(exist_ok=True)
          for file in Path('frontend/test-results').glob('chromium-*.png'): shutil.copyfile(file,shots/file.name)
          results = Path('frontend/test-results/results.json')
          if results.exists(): shutil.copyfile(results,destination/'browser-results.json')
          passed = report['all_executed_checks_passed']
          message = f"\n## Clean native verification — Actions {os.environ['GITHUB_RUN_ID']}\n\nSource commit: `{report['source_commit']}`. All executed checks passed: **{passed}**.\nResults, exact commands/exit codes/source hashes and fictional screenshots are\ncommitted under `verification/acceptance-2026-09-18/`. Read stage logs for counts\nand durations. These are mocked-provider/loopback checks, not live verification.\n"
          with Path('CONTINUATION.md').open('a') as f: f.write(message)
          (destination/'README.md').write_text('# Native workspace verification\n\n'+message+'\nScreenshots are actual Chromium renders of the fictional local fixture, not mockups or production records. No lead contact, deployment or real provider calls occurred.\n')
          PY
          git add CONTINUATION.md verification/acceptance-2026-09-18
          git commit -m 'test(workspace): retain exact clean-source verification and actual desktop/mobile screenshots'
          git push origin HEAD:refs/heads/feat/ai-leads-workspace-continue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-native-workspace-verification
          path: |
            /tmp/workspace-final-verification/
            frontend/test-results/
          retention-days: 14
