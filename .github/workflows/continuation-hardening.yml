name: Continuation backend hardening
on:
  push:
    branches: [feat/ai-leads-workspace-continue]
    paths: [.github/workflows/continuation-hardening.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/feat/ai-leads-workspace-continue'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      ENABLE_OUTBOUND: 'false'
      OPENAI_API_KEY: ''
      WORKSPACE_API_KEY: ''
      TWILIO_AUTH_TOKEN: ''
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruct exact reviewed source
        run: |
          git apply --unidiff-zero --index continuation/03-backend.patch
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          for section in Path('continuation/03-backend.patch').read_text().split('diff --git ')[1:]:
              name = section.splitlines()[0].split(' b/',1)[1]
              expected = re.search(r'^index [0-9a-f]{40}\.\.([0-9a-f]{40})',section,re.M)[1]
              actual = subprocess.check_output(['git','hash-object',name],text=True).strip()
              assert actual == expected, (name, expected, actual)
              print('Verified',name,actual)
          PY
          git diff --cached --exit-code -- recovery/ RECOVERY-START-HERE.md
          python recovery/ai-leads-workspace-v2/verify_github_checkpoint.py
      - name: Fresh baseline regression verification
        run: |
          python -m pip install -r requirements-dev.txt
          python -m compileall -q app
          python -m pytest tests -q
      - name: Preserve native-source milestone, never overwrite newer work
        env:
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/feat/ai-leads-workspace-continue'
          git config user.name 'Relay continuation verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '\n## Milestone 3: reconciliation hardening\n\nExact-source backend fixes verified in Actions run %s. Human precedence now applies to procurement, proposal, budget and other supported facts; approved playbook gates fit; practice redaction does not erase real intelligence; provider reads are bounded; terminal capture and generation checks reject stale results; paginated scoped history and note-source APIs are connected.\n\nLocal acceptance run before this checkpoint: 155 tests passed (87 baseline + 68 workspace cases), one upstream Starlette/AnyIO deprecation warning. Frontend type-check/lint/build passed; first two Chromium desktop/mobile source-navigation tests passed after fixing initial grid measurement. Expanded browser tests and final frontend publication remain in progress. No live model/provider calls, deployment or lead contact. Recovery remains unchanged.\n' "$GITHUB_RUN_ID" >> CONTINUATION.md
          git add CONTINUATION.md
          git commit -m 'fix: harden workspace reconciliation and preserve paginated scoped source history'
          AUTH=$(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/ai-leads-workspace-continue
