name: Workspace final acceptance verification
on:
  push:
    branches: [feat/ai-leads-workspace-continue]
    paths: ['.github/workflows/workspace-browser-sync-verification.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/feat/ai-leads-workspace-continue'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENABLE_OUTBOUND: 'false'
      OPENAI_API_KEY: ''
      WORKSPACE_API_KEY: ''
      TWILIO_AUTH_TOKEN: ''
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-leads-workspace-continue
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish exact readiness fixes without changing application behavior
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          p = Path('continuation/08-browser-sync.patch')
          target = 'frontend/e2e/acceptance.spec.ts'
          def blob(): return subprocess.check_output(['git','hash-object',target],text=True).strip()
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '24138168d434fab987a026189f1f75acbf660b71c085870e1fb0070574ef7e37'
          assert blob() == '37ba325d66225c7dd1286c5a786feb4225e731c2'
          subprocess.run(['git','apply','--check','--index',str(p)],check=True)
          subprocess.run(['git','apply','--index',str(p)],check=True)
          assert blob() == 'dec9ba5d6137c90c4b2429e42e3c382f0819c98e'
          with Path('CONTINUATION.md').open('a') as f:
              f.write('\n## Clean-run readiness corrections — 2026-09-18\n\nThe first clean GitHub run on 4b317dad had 169 backend and 8 unit tests passing,\nwith 19/22 browser cases passing. Two failures sampled geometry during a CSS\ntransition; the third pressed Escape before the asynchronous lead dialog opened.\nThe same rendered ordering condition now waits for UI readiness, and the dialog\nmust visibly open and close before the practice transition. No test was skipped,\nno layout assertion removed, and no application validation relaxed. Stable\nrendered-overview tests also check non-overlap and viewport bounds directly.\nHistorical failed results remain at df36ce182c20873392a22e9a34560b8732defa0c.\nThis native test fix is committed before rerunning the entire suite.\n')
          PY
          git rm continuation/08-browser-sync.patch
          git add CONTINUATION.md
          git diff --exit-code HEAD -- recovery/ai-leads-workspace-v2
          git config user.name 'Relay workspace implementation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(workspace): synchronize actual geometry and dialog readiness without weakening acceptance'
          git push origin HEAD:refs/heads/feat/ai-leads-workspace-continue
      - name: Install exact native dependencies and Chromium
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
      - name: Verify the entire native implementation
        run: |
          set -euo pipefail
          python scripts/verify_workspace.py --output /tmp/workspace-final-verification
          git diff --exit-code -- web/workspace recovery/ai-leads-workspace-v2
          test -z "$(git ls-files --others --exclude-standard web/workspace)"
      - name: Preserve complete executed results, including any failures
        if: always()
        run: |
          set -euo pipefail
          test -f /tmp/workspace-final-verification/RESULTS.json || exit 0
          python - <<'PY'
          from pathlib import Path
          import json, shutil, os
          source = Path('/tmp/workspace-final-verification')
          report = json.loads((source/'RESULTS.json').read_text())
          destination = Path('verification/acceptance-2026-09-18')
          destination.mkdir(parents=True,exist_ok=True)
          for file in source.iterdir():
              if file.suffix in ('.txt','.json'): shutil.copyfile(file,destination/file.name)
          shots = destination/'screenshots'; shots.mkdir(exist_ok=True)
          for file in Path('frontend/test-results').glob('chromium-*.png'): shutil.copyfile(file,shots/file.name)
          results = Path('frontend/test-results/results.json')
          if results.exists(): shutil.copyfile(results,destination/'browser-results.json')
          for file in Path('frontend/test-results').glob('*/error-context.md'):
              target = destination/'failure-contexts'/file.parent.name
              target.mkdir(parents=True,exist_ok=True); shutil.copyfile(file,target/file.name)
          message = f"\n## Final clean verification — Actions {os.environ['GITHUB_RUN_ID']}\n\nSource: `{report['source_commit']}`. All executed stages passed: **{report['all_executed_checks_passed']}**.\nCommands, timings, source hashes, per-stage logs and actual fictional screenshots\nare in `verification/acceptance-2026-09-18/`. The verification uses only mocked\nproviders and loopback fixtures. No live provider or outbound operation occurred.\n"
          with Path('CONTINUATION.md').open('a') as f: f.write(message)
          (destination/'README.md').write_text('# Native workspace verification\n'+message+'\nPrefer screenshots/*-rendered-overview.png for the settled actual desktop/mobile layout. The browser tests explicitly check non-overlap and viewport bounds before capturing them. Earlier failures are retained in Git history at df36ce182c20873392a22e9a34560b8732defa0c.\n')
          PY
          git add CONTINUATION.md verification/acceptance-2026-09-18
          git commit -m 'test(workspace): retain fresh complete acceptance results and settled actual screenshots'
          git push origin HEAD:refs/heads/feat/ai-leads-workspace-continue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-final-acceptance
          path: |
            /tmp/workspace-final-verification/
            frontend/test-results/
          retention-days: 14
