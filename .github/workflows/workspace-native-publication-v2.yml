name: Publish native workspace source and results
on:
  push:
    branches: [feat/ai-leads-workspace-continue]
    paths: ['.github/workflows/workspace-native-publication-v2.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/feat/ai-leads-workspace-continue'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENABLE_OUTBOUND: 'false'
      OPENAI_API_KEY: ''
      WORKSPACE_API_KEY: ''
      TWILIO_AUTH_TOKEN: ''
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-leads-workspace-continue
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the pinned reviewed publisher without workflow-file mutations
        run: |
          set -euo pipefail
          python -m pip install PyYAML==6.0.3
          python - <<'PY'
          import subprocess, yaml
          # Reuse the exact reviewed NEW incremental publication commands. This
          # is not any historical restoration workflow. Source patch hashes and
          # parent/result native blob guards remain unchanged.
          anchor = 'afb597355d254d5a2b7c4a95ce3adc1cf75b4732'
          definition = subprocess.check_output(['git','show',anchor+':.github/workflows/workspace-final-publication.yml'],text=True)
          steps = yaml.safe_load(definition)['jobs']['publish-and-verify']['steps']
          runs = {step['name']:step['run'] for step in steps if 'run' in step}
          names = ['Validate and apply only these reviewed incremental source changes',
                   'Install pinned dependencies and retain exact license notices',
                   'Publish useful native milestone before full browser run']
          for name in names:
              command = runs[name]
              if name == names[-1]:
                  # Actions may publish source but may not update workflows.
                  # The authorized GitHub connector will publish CI separately.
                  subprocess.run(['git','restore','--source=HEAD','--staged','--worktree','.github/workflows/workspace-ci.yml'],check=True)
                  marker = ' .github/workflows/workspace-final-publication.yml'
                  assert command.count(marker) == 1
                  command = command.replace(marker,'')
              subprocess.run(['bash','-euo','pipefail','-c',command],check=True)
          PY
      - name: Fresh complete native verification
        run: |
          set -euo pipefail
          cd frontend
          npx playwright install --with-deps chromium
          cd ..
          python scripts/verify_workspace.py --output /tmp/workspace-final-verification
          git diff --exit-code -- web/workspace recovery/ai-leads-workspace-v2
          test -z "$(git ls-files --others --exclude-standard web/workspace)"
      - name: Persist actual executed results and fictional screenshots
        if: always()
        run: |
          set -euo pipefail
          test -f /tmp/workspace-final-verification/RESULTS.json || exit 0
          python - <<'PY'
          import subprocess, yaml
          anchor = 'afb597355d254d5a2b7c4a95ce3adc1cf75b4732'
          definition = subprocess.check_output(['git','show',anchor+':.github/workflows/workspace-final-publication.yml'],text=True)
          steps = yaml.safe_load(definition)['jobs']['publish-and-verify']['steps']
          step = next(s for s in steps if s.get('name') == 'Preserve actual results and fictional screenshots')
          subprocess.run(['bash','-euo','pipefail','-c',step['run']],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-native-workspace-verification
          path: |
            /tmp/workspace-final-verification/
            frontend/test-results/
          retention-days: 14
